<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - Spotify</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" 
    integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
     crossorigin="anonymous" referrerpolicy="no-referrer" />
      <link rel="icon" href="https://img.utdstc.com/icon/4ba/1ef/4ba1ef03c48c81bb20965a85d244c07ec086c20f4ec9a047828e19ecbf245490:200" type="image/x-icon" sizes="32x32">
</head>
<body>
    <div id="main-section">
        <div class="main-box">
            <img src="logo copy.png" alt="image not found">
            <h1>Log in to Spotify</h1>
            <button class="google"><img src="google.png" alt="image not found"><span>Continue with Google</span></button><br>
            <button class="facebook"><img src="facebook.png" alt="image not found"><span>Continue with facebook</span></button><br>
            <button class="apple"><img src="apple.png" alt="image not found"><span>Continue with Apple</span></button><br>
            <button class="phone"><span>Continue with Phone number</span></button><br>
            <hr style="width: 500px; color: gray;position: relative; left: 100px;top: 210px;opacity: 20%;outline: none;">
            <p>Email or Username</p><br>
            <input type="text" placeholder="Email or Username" class="input"><br>
            <button class="Continue"><span>Continue</span></button>
            <p class="last-p">Don't have an account? <a href="#">Sign up for Spotify</a></p>

        </div>
        <div class="last-box">
            <h3>This site is protected by reCAPTCHA and the Google<span>Privacy Policy</span> and <span>Terms of Service</span> apply.</h3>
        </div>
    </div>
</body>
</html>
